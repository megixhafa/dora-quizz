<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Quality Check</title>
<style>
  :root {
    --bg: #0a0f1f;
    --panel: #121a33;
    --panel-2: #18224280;
    --line: #26315a;
    --text: #e9edff;
    --muted: #8f9bc7;
    --accent: #4de2c5;
    --accent-2: #7c8cff;
    --good: #3ddc97;
    --bad: #ff5d73;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, Menlo, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--text);
    background:
      radial-gradient(900px 500px at 85% -10%, #7c8cff2e, transparent 60%),
      radial-gradient(800px 500px at 0% 110%, #4de2c526, transparent 60%),
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 44px 44px,
      var(--bg);
    background-blend-mode: normal, normal, soft-light, soft-light, normal;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  /* ---------- top bar ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 20px clamp(16px, 4vw, 48px);
    font-family: var(--mono); font-size: 14px; color: var(--muted);
  }
  .brand { display: flex; align-items: center; gap: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  .pipeline { display: flex; align-items: center; }
  .node {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    border: 2px solid var(--line); background: var(--panel); color: var(--muted);
    font-size: 13px; font-weight: 700; transition: all .3s;
  }
  .node.current { border-color: var(--accent-2); color: var(--text); box-shadow: 0 0 0 5px #7c8cff2e; }
  .node.pass { border-color: var(--good); background: var(--good); color: #05251a; }
  .node.fail { border-color: var(--bad); background: var(--bad); color: #33040c; }
  .link { width: clamp(16px, 4vw, 56px); height: 2px; background: var(--line); }
  .link.done { background: var(--accent-2); }

  /* ---------- stage ---------- */
  main {
    flex: 1; display: grid; place-items: center;
    padding: 8px clamp(16px, 4vw, 48px) 24px;
  }
  .stage { width: min(1100px, 100%); }
  .enter { animation: rise .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }

  .tag {
    display: inline-flex; gap: 10px; align-items: center;
    font-family: var(--mono); font-size: clamp(13px, 1.4vw, 16px);
    color: var(--accent); letter-spacing: .1em; text-transform: uppercase;
    padding: 6px 12px; border: 1px solid #4de2c555; border-radius: 999px; background: #4de2c512;
  }
  h1 {
    font-size: clamp(30px, 4.6vw, 60px); line-height: 1.1; margin: 18px 0 30px;
    font-weight: 800; letter-spacing: -.02em; text-wrap: balance;
  }
  h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.lead { font-size: clamp(17px, 1.9vw, 23px); color: var(--muted); max-width: 46ch; margin: 0 0 34px; line-height: 1.5; }

  /* ---------- answers ---------- */
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .opt {
    position: relative; display: flex; align-items: center; gap: 18px;
    padding: clamp(18px, 2.6vw, 30px);
    background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
    color: var(--text); font: inherit; text-align: left; cursor: pointer;
    transition: transform .15s, border-color .15s, background .25s, opacity .25s;
  }
  .opt:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--accent-2); }
  .opt:disabled { cursor: default; }
  .key {
    flex: none; width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 700; font-size: 18px;
    background: #7c8cff22; color: var(--accent-2); border: 1px solid #7c8cff55;
  }
  .val { font-size: clamp(26px, 3.6vw, 46px); font-weight: 800; letter-spacing: -.01em; }
  .stamp {
    margin-left: auto; font-family: var(--mono); font-size: clamp(11px, 1.2vw, 14px); font-weight: 700;
    letter-spacing: .12em; padding: 6px 10px; border-radius: 8px; border: 2px solid currentColor;
    transform: rotate(-6deg); animation: stamp .35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes stamp { from { opacity: 0; transform: rotate(-6deg) scale(2.2); } }
  .opt.correct { border-color: var(--good); background: #3ddc971f; }
  .opt.correct .key { background: var(--good); color: #05251a; border-color: var(--good); }
  .opt.correct .stamp { color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: #ff5d731c; animation: shake .4s; }
  .opt.wrong .key { background: var(--bad); color: #33040c; border-color: var(--bad); }
  .opt.wrong .stamp { color: var(--bad); }
  .opt.dim { opacity: .38; }
  @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }

  /* ---------- footer row ---------- */
  .row { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 26px; min-height: 62px; flex-wrap: wrap; }
  .log { font-family: var(--mono); font-size: clamp(14px, 1.5vw, 18px); color: var(--muted); }
  .log.pass { color: var(--good); } .log.fail { color: var(--bad); }
  .log::before { content: "> "; opacity: .6; }
  .btn {
    font: inherit; font-weight: 700; font-size: clamp(16px, 1.6vw, 20px);
    padding: 16px 30px; border-radius: 14px; border: 0; cursor: pointer;
    color: #071226; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 30px #4de2c530; transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px #7c8cff55; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); box-shadow: none; }
  .btn.ghost:hover { color: var(--text); border-color: var(--accent-2); }

  /* ---------- results ---------- */
  .score { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin: 6px 0 28px; }
  .score b { font-size: clamp(64px, 10vw, 128px); font-weight: 800; line-height: 1; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .score span { font-size: clamp(18px, 2.2vw, 28px); color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; border-top: 4px solid var(--good); }
  .tile.fail { border-top-color: var(--bad); }
  .tile .n { font-size: clamp(30px, 3.8vw, 48px); font-weight: 800; }
  .tile .l { color: var(--muted); font-size: clamp(13px, 1.3vw, 16px); margin-top: 6px; line-height: 1.4; }
  .tile .s { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: var(--good); margin-top: 12px; }
  .tile.fail .s { color: var(--bad); }

  footer { padding: 14px clamp(16px, 4vw, 48px) 18px; font-family: var(--mono); font-size: 12px; color: #5f6b99; text-align: center; }
  kbd { border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--panel); }

  @media (max-width: 760px) {
    .options { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .brand span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<header>
  <div class="brand"><i class="dot"></i><span>Data Quality Check</span></div>
  <div class="pipeline" id="pipeline" aria-hidden="true"></div>
</header>

<main><div class="stage" id="stage"></div></main>

<footer>
  <kbd>A</kbd>–<kbd>D</kbd> pick &nbsp;·&nbsp; <kbd>Enter</kbd> / <kbd>→</kbd> next &nbsp;·&nbsp; <kbd>←</kbd> back &nbsp;·&nbsp; <kbd>R</kbd> redo question
</footer>

<script>
// ---- Edit your questions here -------------------------------------------
// `answer` is the index of the correct option (0 = A, 1 = B, 2 = C, 3 = D).
const QUESTIONS = [
  { id: "1.1", tag: "Volume",
    q: "How many CTs have we delivered in VC this year?",
    options: ["20", "30", "15", "25"], answer: 1,
    fact: "CTs delivered in VC this year" },
  { id: "1.2", tag: "Distribution",
    q: "What share of our CTs are level 1 or level 2?",
    options: ["40%", "60%", "50%", "30%"], answer: 2,
    fact: "of our CTs are level 1 or level 2" },
  { id: "1.3", tag: "Timeliness",
    q: "Without the agent, how long does a level 1 or 2 CT take to reach the market?",
    options: ["10 hours", "13 hours", "15 hours", "17 hours"], answer: 3,
    fact: "time to market without the agent (level 1 or 2 CTs)" },
  { id: "1.4", tag: "Efficiency",
    q: "By how much does DORA increase our efficiency?",
    options: ["70%", "60%", "50%", "40%"], answer: 0,
    fact: "efficiency gain with DORA" },
];
const VERDICTS = ["it's giving dirty data 💀", "big yikes, needs remediation", "mid, needs a cleanse", "lowkey fit for purpose ✨", "gold-certified, no notes 👑"];
// Reaction lines, one per question (they cycle if you add more questions).
const WINS = ["no cap, the room ate that 💅", "clean data, immaculate vibes ✨", "W for the room, record validated 🔥", "slay, zero quality issues 👑"];
const FAILS = ["not the vibe 💀 expected value:", "that's giving dirty data 🚩 expected value:", "L detected 😬 expected value:", "the rule said nope 🙅 expected value:"];
// --------------------------------------------------------------------------

const LETTERS = ["A", "B", "C", "D"];
const stage = document.getElementById("stage");
const pipeline = document.getElementById("pipeline");
let step = -1;                                  // -1 intro, 0..n-1 questions, n results
const picks = QUESTIONS.map(() => null);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isRight = i => picks[i] === QUESTIONS[i].answer;

function renderPipeline() {
  pipeline.innerHTML = QUESTIONS.map((_, i) => {
    const cls = picks[i] !== null ? (isRight(i) ? "pass" : "fail") : i === step ? "current" : "";
    const mark = picks[i] !== null ? (isRight(i) ? "✓" : "✕") : i + 1;
    return (i ? `<i class="link ${i <= step ? "done" : ""}"></i>` : "") + `<i class="node ${cls}">${mark}</i>`;
  }).join("");
}

function render(animate = true) {
  renderPipeline();
  const a = animate ? "enter" : "";
  if (step < 0) {
    stage.innerHTML = `<div class="${a}">
      <span class="tag">Incoming batch · ${QUESTIONS.length} records to validate</span>
      <h1>Quick vibe check:<br>how clean is <em>your data</em> about us?</h1>
      <p class="lead">Four quick questions. Shout your answer, we log it, and the quality rules decide if it slays or gets rejected.</p>
      <button class="btn" data-act="next">Run the checks →</button>
    </div>`;
  } else if (step < QUESTIONS.length) {
    const Q = QUESTIONS[step], pick = picks[step], done = pick !== null;
    const opts = Q.options.map((o, i) => {
      let cls = "", stamp = "";
      if (done) {
        if (i === Q.answer) { cls = "correct"; stamp = `<span class="stamp">VALID</span>`; }
        else if (i === pick) { cls = "wrong"; stamp = `<span class="stamp">REJECTED</span>`; }
        else cls = "dim";
      }
      return `<button class="opt ${cls}" data-pick="${i}" ${done ? "disabled" : ""}>
        <span class="key">${LETTERS[i]}</span><span class="val">${esc(o)}</span>${stamp}</button>`;
    }).join("");
    const log = !done ? `<span class="log">waiting on the room… no pressure 👀</span>`
      : isRight(step) ? `<span class="log pass">${esc(WINS[step % WINS.length])}</span>`
      : `<span class="log fail">${esc(FAILS[step % FAILS.length])} ${esc(Q.options[Q.answer])}</span>`;
    const last = step === QUESTIONS.length - 1;
    stage.innerHTML = `<div class="${a}">
      <span class="tag">Check ${esc(Q.id)} · ${esc(Q.tag)}</span>
      <h1>${esc(Q.q)}</h1>
      <div class="options">${opts}</div>
      <div class="row">${log}${done ? `<button class="btn" data-act="next">${last ? "See the audit report →" : "Next check →"}</button>` : ""}</div>
    </div>`;
  } else {
    const right = QUESTIONS.filter((_, i) => isRight(i)).length;
    const pct = Math.round(100 * right / QUESTIONS.length);
    const verdict = VERDICTS[Math.round((VERDICTS.length - 1) * right / QUESTIONS.length)];
    const tiles = QUESTIONS.map((Q, i) => `<div class="tile ${isRight(i) ? "" : "fail"}">
        <div class="n">${esc(Q.options[Q.answer])}</div><div class="l">${esc(Q.fact)}</div>
        <div class="s">${isRight(i) ? "✓ PASSED" : "✕ CORRECTED"}</div></div>`).join("");
    stage.innerHTML = `<div class="${a}">
      <span class="tag">Audit report · ${right}/${QUESTIONS.length} checks passed</span>
      <div class="score"><b>${pct}%</b><span>room quality score: ${esc(verdict)}</span></div>
      <div class="tiles">${tiles}</div>
      <div class="row"><span class="log pass">dataset cleaned. now meet DORA, she's that girl ✨</span>
        <button class="btn ghost" data-act="restart">Restart</button></div>
    </div>`;
    if (pct >= 50) confetti(160);
  }
}

function pick(i) {
  if (step < 0 || step >= QUESTIONS.length || picks[step] !== null || i >= QUESTIONS[step].options.length) return;
  picks[step] = i;
  render(false);
  if (isRight(step)) confetti(90);
}
function next() {
  if (step >= QUESTIONS.length) return;
  if (step >= 0 && picks[step] === null) return;     // answer first
  step++; render();
}
function back() { if (step >= 0) { step--; render(); } }
function redo() { if (step >= 0 && step < QUESTIONS.length) { picks[step] = null; render(false); } }
function restart() { picks.fill(null); step = -1; render(); }

stage.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.pick !== undefined) pick(+b.dataset.pick);
  else if (b.dataset.act === "next") next();
  else if (b.dataset.act === "restart") restart();
});
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const i = "abcd".indexOf(k) >= 0 && k.length === 1 ? "abcd".indexOf(k) : "1234".indexOf(k) >= 0 && k.length === 1 ? "1234".indexOf(k) : -1;
  if (i >= 0) pick(i);
  else if (k === "enter" || k === " " || k === "arrowright") next();
  else if (k === "arrowleft") back();
  else if (k === "r") redo();
  else return;
  e.preventDefault();
});

// ---- tiny confetti --------------------------------------------------------
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let bits = [], raf = 0;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n) {
  if (calm) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#4de2c5", "#7c8cff", "#3ddc97", "#ffd166", "#e9edff"];
  for (let i = 0; i < n; i++) bits.push({
    x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .45,
    vx: (Math.random() - .5) * 18, vy: -Math.random() * 16 - 4,
    s: Math.random() * 8 + 4, r: Math.random() * 6, c: colors[i % colors.length], life: 0,
  });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  bits = bits.filter(b => b.y < cv.height + 20 && b.life < 220);
  for (const b of bits) {
    b.vy += .45; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += .2; b.life++;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r);
    cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore();
  }
  raf = bits.length ? requestAnimationFrame(tick) : 0;
}

render();
</script>
</body>
</html>
